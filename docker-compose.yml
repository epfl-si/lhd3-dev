version: '3'
services:
    db:
      image: mariadb:10.2
      environment:
        - MYSQL_ROOT_PASSWORD=ROOT
        - MYSQL_ROOT_HOST=%
      ports:
       - 127.0.0.1:3307:3306
      networks:
        - default

    dbpostgresql:
      image: postgres:18.1
      container_name: lhd-postgres
      environment:
        - POSTGRES_USER=root
        - POSTGRES_PASSWORD=ROOT
        - POSTGRES_DB=lhd
      ports:
        - 127.0.0.1:45432:5432
